<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Попов Александр — Frontend-разработчик. Превращаю макеты в живые адаптивные интерфейсы на React и TypeScript." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <clipPath id="rc"><rect x="1" y="1" width="898" height="328" rx="22"/></clipPath>
</defs>
<g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="1" y="1" width="898" height="328" rx="22" fill="url(#bg)" stroke="url(#ac)" stroke-width="2"/>
  <g clip-path="url(#rc)">
    <circle cx="840" cy="30" r="130" fill="#6366f1" fill-opacity=".14"/>
    <circle cx="40" cy="320" r="110" fill="#ec4899" fill-opacity=".10"/>
  </g>

  <circle cx="78" cy="76" r="36" fill="url(#ac)"/>
  <text x="78" y="86" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">АП</text>
  <text x="130" y="70" font-size="28" font-weight="700" fill="#ffffff">Попов Александр</text>
  <text x="130" y="96" font-size="16" fill="#a5b4fc">Frontend-разработчик</text>

  <rect x="662" y="56" width="198" height="36" rx="18" fill="#22c55e" fill-opacity=".14" stroke="#22c55e" stroke-opacity=".55"/>
  <circle cx="685" cy="74" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="701" y="79" font-size="14" font-weight="600" fill="#86efac">Открыт к работе</text>

  <text x="40" y="150" font-size="19" fill="#e2e8f0">Превращаю макеты в живые, адаптивные интерфейсы на React и TypeScript.</text>
  <text x="40" y="178" font-size="17" fill="#94a3b8">Люблю аккуратный код, продуманный UX и задачи, в которых можно расти.</text>
  
  <rect x="40" y="206" width="262" height="100" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
  <rect x="56" y="206" width="48" height="4" rx="2" fill="#818cf8"/>
  <text x="60" y="238" font-size="13" font-weight="700" fill="#818cf8">01</text>
  <text x="60" y="264" font-size="19" font-weight="700" fill="#ffffff">Чистый код</text>
  <text x="60" y="288" font-size="13.5" fill="#94a3b8">Типизация и ясная структура</text>
  <rect x="319" y="206" width="262" height="100" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
  <rect x="335" y="206" width="48" height="4" rx="2" fill="#f472b6"/>
  <text x="339" y="238" font-size="13" font-weight="700" fill="#f472b6">02</text>
  <text x="339" y="264" font-size="19" font-weight="700" fill="#ffffff">Адаптивный UI</text>
  <text x="339" y="288" font-size="13.5" fill="#94a3b8">Mobile-first, pixel-perfect</text>
  <rect x="598" y="206" width="262" height="100" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10"/>
  <rect x="614" y="206" width="48" height="4" rx="2" fill="#22d3ee"/>
  <text x="618" y="238" font-size="13" font-weight="700" fill="#22d3ee">03</text>
  <text x="618" y="264" font-size="19" font-weight="700" fill="#ffffff">Быстро учусь</text>
  <text x="618" y="288" font-size="13.5" fill="#94a3b8">Осваиваю новое на практике</text>
</g>
</svg>
